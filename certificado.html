      function goBack() {

          history.back();
          return;
        }

      }

      document.querySelectorAll("[data-back]").forEach((button) => {

      });

            <p class="eyebrow">Certificado não encontrado</p>

            </div>
          </section>
        `;
        app.querySelector("[data-back]").addEventListener("click", goBack);
      }

        document.title = `${data.title} | Lorran Daniel`;

        const details = data.details
          .map(
            ([label, value]) => `
              <div class="meta-item">
                <strong>${label}</strong>
                <span>${value}</span>
              </div>
            `,
          )
          .join("");

        const learned = data.learned.map((item) => `<li>${item}</li>`).join("");

        app.innerHTML = `
          <section class="container certificate-layout">
            <div class="certificate-content">
              <article class="summary">
                <p class="eyebrow">${data.category}</p>
                <h1>${data.title}</h1>
                <p class="description">${data.description}</p>

                <div class="meta-grid">${details}</div>

                <div class="actions">
                  <button class="button primary" type="button" data-back>Voltar para a página anterior</button>
                  <a class="button" href="${data.pdf}" target="_blank" rel="noreferrer">Abrir PDF original</a>
                </div>
              </article>

              <article class="learned">
                <p class="section-kicker">O que foi aprendido</p>
                <h2>Resumo do aprendizado</h2>
                <ul>${learned}</ul>
              </article>
            </div>

            <aside class="pdf-panel" aria-label="Visualização do certificado">
              <div class="pdf-header">
                <div>
                  <p class="section-kicker">Certificado</p>
                  <h2>Visualização do PDF</h2>
                </div>
                <a class="button" href="${data.pdf}" target="_blank" rel="noreferrer">Abrir em nova aba</a>
              </div>
              <iframe class="pdf-frame" src="${data.pdf}" title="PDF - ${data.title}"></iframe>
              <p class="pdf-mobile-note">
                A visualização direta do PDF pode não funcionar bem em telas menores. Use o botão
                "Abrir em nova aba" acima para visualizar o certificado com mais conforto.
              </p>
            </aside>
          </section>
        `;

        app.querySelector("[data-back]").addEventListener("click", goBack);
      }

      const scrollTopBtn = document.getElementById("scrollTopBtn");

      window.addEventListener("scroll", () => {
        const isVisible = document.documentElement.scrollTop > 420 || document.body.scrollTop > 420;
        scrollTopBtn.style.display = isVisible ? "inline-flex" : "none";
      });

      scrollTopBtn.addEventListener("click", () => {
